<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub Extension</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="menu">
      <label class="row">
        <input type="checkbox" id="sort-oldest" />
        <span>Sort Oldest</span>
      </label>
      <label class="row">
        <input type="checkbox" id="group-by-dependency" />
        <span>Group by dependency</span>
      </label>
      <label class="row">
        <input type="checkbox" id="filter-drafts-out" />
        <span>Filter drafts out</span>
      </label>
      <label class="row">
        <input type="checkbox" id="filter-approved-by-me" />
        <span>Filter approved by me</span>
      </label>
      <label class="row">
        <input type="checkbox" id="filter-not-approved-by-me" />
        <span>Filter not approved by me</span>
      </label>
      <label class="row">
        <input type="checkbox" id="filter-only-my-prs" />
        <span>Only my PRs</span>
      </label>
      <label class="row">
        <input type="checkbox" id="filter-not-my-prs" />
        <span>Not my PRs</span>
      </label>
      <div class="token-row">
        <button type="button" id="set-token" class="token-btn">Set Token</button>
        <a
          id="generate-token"
          class="token-generate-link"
          href="https://github.com/settings/tokens/new?scopes=repo"
          target="_blank"
          rel="noopener noreferrer"
          >Generate token</a>
      </div>
      <p id="token-hint" class="hint" aria-live="polite"></p>

      <hr class="separator" />

      <div class="section-heading">Jira Cloud</div>
      <label class="field-label" for="jira-base-url">Base URL</label>
      <input type="text" id="jira-base-url" class="field-input"
             placeholder="https://your-domain.atlassian.net" autocomplete="url" />
      <label class="field-label" for="jira-email">Email</label>
      <input type="email" id="jira-email" class="field-input"
             placeholder="you@example.com" autocomplete="email" />
      <label class="field-label" for="jira-api-token">API Token</label>
      <input type="password" id="jira-api-token" class="field-input"
             placeholder="Jira Cloud API token" autocomplete="off" />
      <details class="advanced-toggle">
        <summary>Advanced</summary>
        <label class="field-label" for="jira-ticket-pattern">Ticket pattern (regex)</label>
        <input type="text" id="jira-ticket-pattern" class="field-input mono"
               placeholder="([A-Z][A-Z0-9]+-\d+)" autocomplete="off" />
      </details>
      <button type="button" id="save-jira" class="token-btn">Save Jira Settings</button>
      <p id="jira-hint" class="hint" aria-live="polite"></p>
    </main>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
